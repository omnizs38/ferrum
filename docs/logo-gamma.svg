<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ferrum Gamma</title>
  <desc id="desc">An iron ingot stamped with the Greek letter gamma.</desc>

  <defs>
    <radialGradient id="backdrop" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#8b8c8b"/>
      <stop offset="62%" stop-color="#808180"/>
      <stop offset="100%" stop-color="#727372"/>
    </radialGradient>

    <linearGradient id="topFace" x1="0.08" y1="0.0" x2="0.78" y2="1.0">
      <stop offset="0%" stop-color="#d5d8dc"/>
      <stop offset="26%" stop-color="#c1c5cb"/>
      <stop offset="60%" stop-color="#abb1b8"/>
      <stop offset="100%" stop-color="#9399a1"/>
    </linearGradient>

    <linearGradient id="leftFace" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#9aa0a7"/>
      <stop offset="55%" stop-color="#81878f"/>
      <stop offset="100%" stop-color="#6d737b"/>
    </linearGradient>

    <linearGradient id="frontFace" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#6e747c"/>
      <stop offset="45%" stop-color="#555b63"/>
      <stop offset="100%" stop-color="#42484f"/>
    </linearGradient>

    <linearGradient id="rimLight" x1="0" y1="0" x2="0.8" y2="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="52%" stop-color="#f3f6f9" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#e6ebf0" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="farEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a6067" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3d4248" stop-opacity="0.65"/>
    </linearGradient>

    <clipPath id="topClip">
      <polygon points="200,450 790,75 1070,280 480,655"/>
    </clipPath>

    <filter id="softShadow" x="-25%" y="-70%" width="150%" height="240%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Backdrop, matching the original raster logo's neutral grey -->
  <rect width="1200" height="800" fill="url(#backdrop)"/>

  <!-- Contact shadow -->
  <ellipse cx="620" cy="700" rx="330" ry="42" fill="#2c2f33" opacity="0.28" filter="url(#softShadow)"/>

  <!-- Ingot body (the sides taper inward, like a cast ingot) -->
  <g stroke="#2b2f35" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- short left face -->
    <polygon points="200,450 480,655 502,765 222,575" fill="url(#leftFace)"/>
    <!-- long front face -->
    <polygon points="480,655 1070,280 1060,395 502,765" fill="url(#frontFace)"/>
    <!-- top face -->
    <polygon points="200,450 790,75 1070,280 480,655" fill="url(#topFace)"/>
  </g>

  <!-- Brushed-metal streaks on the top face (parallel to the long axis) -->
  <g clip-path="url(#topClip)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M272 462 L773 143" stroke-width="9" opacity="0.10"/>
    <path d="M300 483 L801 164" stroke-width="4" opacity="0.14"/>
    <path d="M314 493 L815 174" stroke-width="13" opacity="0.07"/>
    <path d="M356 524 L857 205" stroke-width="5" opacity="0.12"/>
    <path d="M384 544 L885 225" stroke-width="7" opacity="0.09"/>
    <path d="M398 554 L899 236" stroke-width="3" opacity="0.13"/>
    <path d="M440 585 L941 266" stroke-width="10" opacity="0.07"/>
    <path d="M482 616 L983 297" stroke-width="4" opacity="0.10"/>
    <path d="M470 408 L690 268" stroke-width="3" opacity="0.14"/>
    <path d="M520 376 L736 240" stroke-width="2" opacity="0.12"/>
  </g>

  <!-- Darker scuffs, kept sparse so the face reads as one plane -->
  <g clip-path="url(#topClip)" fill="none" stroke="#575d64" stroke-linecap="round">
    <path d="M402 437 L550 343" stroke-width="4" opacity="0.22"/>
    <path d="M552 340 L574 324" stroke-width="3" opacity="0.18"/>
    <path d="M721 388 L809 331" stroke-width="5" opacity="0.16"/>
    <path d="M330 530 L386 493" stroke-width="3" opacity="0.20"/>
    <path d="M560 430 L622 390" stroke-width="2" opacity="0.16"/>
  </g>

  <!-- Bright rim where the top face meets the two front faces -->
  <path d="M200 450 L480 655 L1070 280" fill="none" stroke="url(#rimLight)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M480 655 L502 765" fill="none" stroke="#c9ced4" stroke-width="4" opacity="0.30"/>

  <!-- Far top edge catches a little light as well -->
  <path d="M200 450 L790 75" fill="none" stroke="url(#farEdge)" stroke-width="5" stroke-linecap="round"/>

  <!-- Side-face scuffs -->
  <g fill="none" stroke-linecap="round">
    <path d="M524 690 L594 660" stroke="#8e959d" stroke-width="6" opacity="0.26"/>
    <path d="M660 660 L762 618" stroke="#8e959d" stroke-width="5" opacity="0.20"/>
    <path d="M826 545 L890 520" stroke="#3f454c" stroke-width="7" opacity="0.35"/>
    <path d="M892 486 L932 470" stroke="#9aa1a9" stroke-width="4" opacity="0.18"/>
    <path d="M286 524 L338 500" stroke="#a2a8af" stroke-width="5" opacity="0.20"/>
    <path d="M262 584 L306 566" stroke="#565c63" stroke-width="4" opacity="0.28"/>
  </g>

  <!-- Stamped gamma, drawn in the plane of the top face.
       Local glyph axes: x runs along the ingot, y runs toward the viewer. -->
  <g transform="translate(555 338) matrix(1.266 -0.804 1.211 0.887 0 0)">
    <path d="M 8 32 C 15 -2, 51 -7, 68 21 C 77 40, 81 82, 84 146"
          fill="none" stroke="#31353b" stroke-width="21"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    <path d="M 13 28 C 20 -2, 48 -5, 63 18"
          fill="none" stroke="#1f2227" stroke-width="8"
          stroke-linecap="round" opacity="0.25"/>
  </g>
</svg>
